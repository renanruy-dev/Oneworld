# Pipeline de CI (GitHub Actions) do OneWorld
# Executa lint com flake8 e testes automatizados com pytest em ambiente Ubuntu
# Atualizado no commit 8f33301 para configurar PYTHONPATH e actions/setup-python@v5
# resolvendo falhas de build anteriores dos commits 6815494, 48dbcce e f226173

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      # Configuração de PYTHONPATH para que os testes em tests/ localizem o pacote oneworld
      env:
        PYTHONPATH: .
      run: |
        python -m pytest

